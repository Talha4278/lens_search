<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FootballLens — Live Visual Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --panel-bg: #111726;
      --card-bg: #192238;
      --card-hover: #222d4a;
      --accent: #2563eb;
      --lens-glow: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #28354f;
      --pitch-green: #22c55e;
      --error-red: #ef4444;
      --warn-amber: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      background: rgba(17, 23, 38, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #22c55e, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .status-badge {
      font-size: 0.76rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--pitch-green);
      border: 1px solid rgba(34, 197, 94, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--pitch-green);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 450px;
      height: calc(100vh - 58px);
    }

    @media (max-width: 960px) {
      main {
        grid-template-columns: 1fr;
        height: auto;
      }
    }

    /* Left Viewfinder */
    .viewfinder-section {
      position: relative;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .viewport-wrapper {
      position: relative;
      max-width: 100%;
      max-height: 80vh;
      border-radius: 16px;
      overflow: hidden;
      background: #05070c;
      box-shadow: 0 20px 45px rgba(0,0,0,0.8);
    }

    #camera-feed, #uploaded-image {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      display: block;
    }

    #lens-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      z-index: 10;
    }

    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #38bdf8, #22c55e, transparent);
      box-shadow: 0 0 14px #38bdf8;
      display: none;
      z-index: 15;
      animation: scanAnim 2s infinite ease-in-out;
    }

    @keyframes scanAnim {
      0% { top: 5%; opacity: 0.8; }
      50% { top: 90%; opacity: 1; }
      100% { top: 5%; opacity: 0.8; }
    }

    .lens-controls {
      position: absolute;
      bottom: 24px;
      display: flex;
      gap: 12px;
      background: rgba(17, 23, 38, 0.88);
      backdrop-filter: blur(12px);
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid var(--border);
      z-index: 20;
    }

    .btn {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--card-hover);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* Right Panel */
    .results-panel {
      background: var(--panel-bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: relative;
      height: 100%;
      overflow-y: auto;
    }

    .panel-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header h2 {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .matches-count {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .cards-grid {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .lens-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 14px;
      cursor: pointer;
      transition: all 0.22s ease;
      position: relative;
    }

    .lens-card:hover {
      background: var(--card-hover);
      border-color: var(--lens-glow);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    }

    .lens-card.active {
      border-color: var(--lens-glow);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.4);
    }

    .card-img-wrap {
      width: 90px;
      height: 90px;
      border-radius: 10px;
      overflow: hidden;
      background: #080b12;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .card-brand {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }

    .conf-badge {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--pitch-green);
      background: rgba(34, 197, 94, 0.12);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .tap-hint {
      font-size: 0.72rem;
      color: var(--lens-glow);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Status Messages (Not Found & Errors) */
    .not-found-card {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 14px;
      padding: 24px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .not-found-icon {
      font-size: 38px;
    }

    .not-found-title {
      color: #f87171;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .not-found-desc {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .error-card {
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 14px;
      padding: 24px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .error-title {
      color: #fbbf24;
      font-size: 1.05rem;
      font-weight: 700;
    }

    /* Detail View */
    .detail-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--panel-bg);
      z-index: 30;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      animation: slideIn 0.25s ease-out forwards;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    .detail-top {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--card-hover);
      border-color: var(--lens-glow);
    }

    .detail-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .detail-hero-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #080b12;
    }

    .detail-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .detail-tags {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .spec-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin-top: 10px;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .spec-table tr {
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .spec-table tr:last-child {
      border-bottom: none;
    }

    .spec-table td {
      padding: 10px 14px;
    }

    .spec-label {
      color: var(--text-muted);
      width: 44%;
      font-weight: 500;
    }

    .spec-val {
      color: var(--text-main);
      font-weight: 600;
    }

    .empty-state {
      padding: 50px 20px;
      text-align: center;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">⚽</div>
      <span>FootballLens</span>
    </div>
    <div class="status-badge" id="backend-status">
      <div class="status-dot"></div>
      <span id="backend-text">Connected to Qdrant</span>
    </div>
  </header>

  <main>
    <!-- Viewfinder -->
    <section class="viewfinder-section">
      <div class="viewport-wrapper" id="viewport-wrapper">
        <img id="uploaded-image" alt="Target Item" src="" style="display: none;" />
        <video id="camera-feed" autoplay playsinline style="display: none;"></video>
        <canvas id="lens-canvas"></canvas>
        <div class="scan-line" id="scan-line"></div>
      </div>

      <div class="lens-controls">
        <label class="btn" for="file-input">
          📁 <span>Upload Photo</span>
        </label>
        <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileUpload(event)">

        <button class="btn" id="cam-toggle-btn" onclick="toggleCamera()">
          📷 <span>Live Camera</span>
        </button>

        <button class="btn btn-primary" onclick="triggerSearch()">
          ⚡ <span>Search Box</span>
        </button>
      </div>
    </section>

    <!-- Right Results Panel -->
    <aside class="results-panel">
      <div class="panel-header">
        <h2>Visual Matches</h2>
        <span class="matches-count" id="matches-count">Ready</span>
      </div>

      <div class="cards-grid" id="cards-container">
        <div class="empty-state">
          <div style="font-size: 42px; opacity: 0.4;">📸</div>
          <h3>Scan an Item</h3>
          <p>Photograph or upload any football product to search your local catalog in real time.</p>
        </div>
      </div>

      <!-- Specification Overlay -->
      <div class="detail-overlay" id="detail-overlay">
        <div class="detail-top">
          <button class="back-btn" onclick="closeDetail()" title="Back">‹</button>
          <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Product Specifications</span>
        </div>

        <div class="detail-body" id="detail-content"></div>
      </div>
    </aside>
  </main>

  <script>
    const state = {
      isCamera: false,
      stream: null,
      box: { x: 0.15, y: 0.15, w: 0.7, h: 0.7 },
      dragging: false,
      dragStart: { x: 0, y: 0 },
      currentMatches: []
    };

    const canvas = document.getElementById('lens-canvas');
    const ctx = canvas.getContext('2d');
    const imgEl = document.getElementById('uploaded-image');
    const videoEl = document.getElementById('camera-feed');
    const scanLine = document.getElementById('scan-line');
    const cardsContainer = document.getElementById('cards-container');
    const matchesCount = document.getElementById('matches-count');
    const detailOverlay = document.getElementById('detail-overlay');
    const detailContent = document.getElementById('detail-content');

    function resizeCanvas() {
      const activeEl = state.isCamera ? videoEl : imgEl;
      if (!activeEl || !activeEl.clientWidth) return;
      canvas.width = activeEl.clientWidth;
      canvas.height = activeEl.clientHeight;
      drawBoundingBox();
    }

    window.addEventListener('resize', resizeCanvas);

    function drawBoundingBox() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const x = state.box.x * canvas.width;
      const y = state.box.y * canvas.height;
      const w = state.box.w * canvas.width;
      const h = state.box.h * canvas.height;

      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.clearRect(x, y, w, h);

      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);

      const cornerLen = 18;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.moveTo(x, y + cornerLen); ctx.lineTo(x, y); ctx.lineTo(x + cornerLen, y); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + w - cornerLen, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + cornerLen); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y + h - cornerLen); ctx.lineTo(x, y + h); ctx.lineTo(x + cornerLen, y + h); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + w - cornerLen, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - cornerLen); ctx.stroke();
    }

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const bx = state.box.x * canvas.width;
      const by = state.box.y * canvas.height;
      const bw = state.box.w * canvas.width;
      const bh = state.box.h * canvas.height;

      if (mouseX >= bx && mouseX <= bx + bw && mouseY >= by && mouseY <= by + bh) {
        state.dragging = true;
        state.dragStart = { x: mouseX - bx, y: mouseY - by };
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!state.dragging) return;
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      let newX = (mouseX - state.dragStart.x) / canvas.width;
      let newY = (mouseY - state.dragStart.y) / canvas.height;

      newX = Math.max(0, Math.min(newX, 1 - state.box.w));
      newY = Math.max(0, Math.min(newY, 1 - state.box.h));

      state.box.x = newX;
      state.box.y = newY;
      drawBoundingBox();
    });

    window.addEventListener('mouseup', () => {
      if (state.dragging) {
        state.dragging = false;
        triggerSearch();
      }
    });

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (state.stream) stopCamera();

      const reader = new FileReader();
      reader.onload = (event) => {
        imgEl.src = event.target.result;
        imgEl.style.display = 'block';
        videoEl.style.display = 'none';
        state.isCamera = false;
        imgEl.onload = () => {
          resizeCanvas();
          triggerSearch();
        };
      };
      reader.readAsDataURL(file);
    }

    async function toggleCamera() {
      if (state.isCamera) {
        stopCamera();
      } else {
        try {
          state.stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' }
          });
          videoEl.srcObject = state.stream;
          videoEl.style.display = 'block';
          imgEl.style.display = 'none';
          state.isCamera = true;
          document.getElementById('cam-toggle-btn').innerHTML = '⏹️ <span>Stop Camera</span>';
          videoEl.onloadedmetadata = () => {
            resizeCanvas();
          };
        } catch (err) {
          alert('Camera unavailable: ' + err.message);
        }
      }
    }

    function stopCamera() {
      if (state.stream) {
        state.stream.getTracks().forEach(t => t.stop());
        state.stream = null;
      }
      state.isCamera = false;
      document.getElementById('cam-toggle-btn').innerHTML = '📷 <span>Live Camera</span>';
    }

    // Real Live Search against FastAPI / Qdrant
    async function triggerSearch() {
      const activeEl = state.isCamera ? videoEl : imgEl;
      if (!activeEl || (!activeEl.src && !state.stream)) {
        return;
      }

      scanLine.style.display = 'block';
      closeDetail();
      matchesCount.textContent = 'Searching database...';

      const bboxStr = `${state.box.x.toFixed(3)},${state.box.y.toFixed(3)},${(state.box.x + state.box.w).toFixed(3)},${(state.box.y + state.box.h).toFixed(3)}`;

      try {
        const formData = new FormData();
        formData.append('bounding_box', bboxStr);
        const blob = await getCurrentFrameBlob();
        formData.append('file', blob, 'query.jpg');

        const response = await fetch('/api/search', {
          method: 'POST',
          body: formData
        });

        scanLine.style.display = 'none';

        if (!response.ok) {
          throw new Error(`Server returned HTTP ${response.status}`);
        }

        const data = await response.json();

        // Check if object was found or below threshold
        if (data.status === 'not_found' || !data.matches || data.matches.length === 0) {
          renderNotFound();
        } else {
          renderCards(data.matches);
        }

      } catch (err) {
        scanLine.style.display = 'none';
        renderError(err.message);
      }
    }

    async function getCurrentFrameBlob() {
      const captureCanvas = document.createElement('canvas');
      const activeEl = state.isCamera ? videoEl : imgEl;
      captureCanvas.width = activeEl.videoWidth || activeEl.naturalWidth || 640;
      captureCanvas.height = activeEl.videoHeight || activeEl.naturalHeight || 480;
      const cCtx = captureCanvas.getContext('2d');
      cCtx.drawImage(activeEl, 0, 0, captureCanvas.width, captureCanvas.height);
      return new Promise(resolve => captureCanvas.toBlob(resolve, 'image/jpeg', 0.85));
    }

    // Renders Real Matches
    function renderCards(matches) {
      state.currentMatches = matches || [];
      matchesCount.textContent = `${matches.length} matches found • tap to view specs`;

      cardsContainer.innerHTML = matches.map((item, index) => {
        const conf = item.percentage || `${Math.round((item.score || 0.0) * 100)}%`;
        const imgPath = item.image_url || '';
        const price = item.specifications?.Price || '';

        return `
          <div class="lens-card" onclick="openDetail(${index})" id="card-${index}">
            <div class="card-img-wrap">
              <img src="${imgPath}" class="card-img" alt="${item.title}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'90\\' height=\\'90\\' fill=\\'%231e293b\\'><rect width=\\'90\\' height=\\'90\\'/><text x=\\'50%\\' y=\\'50%\\' fill=\\'%2394a3b8\\' dominant-baseline=\\'middle\\' text-anchor=\\'middle\\' font-size=\\'12\\'>Photo</text></svg>'">
            </div>
            <div class="card-info">
              <div>
                <h3 class="card-title">${item.title}</h3>
                <div class="card-brand">${item.brand} • ${item.category}</div>
              </div>
              <div class="card-footer">
                <span class="conf-badge">🎯 ${conf} Match</span>
                <span class="tap-hint">${price} <span>›</span></span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Displayed when an object does NOT exist in the catalog
    function renderNotFound() {
      state.currentMatches = [];
      matchesCount.textContent = '0 matches';
      cardsContainer.innerHTML = `
        <div class="not-found-card">
          <div class="not-found-icon">❌</div>
          <h3 class="not-found-title">Object Not Found</h3>
          <p class="not-found-desc">
            The scanned object does not match any items stored in your football catalog. 
            (Similarity is below the confidence threshold).
          </p>
          <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 4px;">
            Tip: Adjust the bounding box over the specific product or ensure the item has been indexed in Qdrant.
          </div>
        </div>
      `;
    }

    // Displayed when server connection fails
    function renderError(msg) {
      state.currentMatches = [];
      matchesCount.textContent = 'Error';
      cardsContainer.innerHTML = `
        <div class="error-card">
          <div style="font-size: 38px;">⚠️</div>
          <h3 class="error-title">Backend Error</h3>
          <p class="not-found-desc">
            Could not communicate with the API: <code>${msg}</code>.<br>
            Make sure <code>python app.py</code> is actively running on port 8000.
          </p>
        </div>
      `;
    }

    // Opens Specification Drawer
    function openDetail(index) {
      const item = state.currentMatches[index];
      if (!item) return;

      document.querySelectorAll('.lens-card').forEach(c => c.classList.remove('active'));
      const activeCard = document.getElementById(`card-${index}`);
      if (activeCard) activeCard.classList.add('active');

      const conf = item.percentage || `${Math.round((item.score || 0.0) * 100)}%`;
      const imgPath = item.image_url || '';

      const specsRows = Object.entries(item.specifications || {}).map(([k, v]) => `
        <tr>
          <td class="spec-label">${k}</td>
          <td class="spec-val">${v}</td>
        </tr>
      `).join('');

      detailContent.innerHTML = `
        <img src="${imgPath}" class="detail-hero-img" alt="${item.title}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'400\\' height=\\'200\\' fill=\\'%231e293b\\'><rect width=\\'400\\' height=\\'200\\'/><text x=\\'50%\\' y=\\'50%\\' fill=\\'%2394a3b8\\' dominant-baseline=\\'middle\\' text-anchor=\\'middle\\' font-size=\\'16\\'>Product Photo</text></svg>'">
        
        <div>
          <div class="detail-tags">
            <span class="conf-badge">🎯 ${conf} Match</span>
            <span style="font-size: 0.78rem; color: var(--text-muted);">SKU: ${item.sku}</span>
          </div>
          <h2 class="detail-title" style="margin-top: 8px;">${item.title}</h2>
          <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">${item.brand} • ${item.category}</div>
        </div>

        <div>
          <h4 style="font-size: 0.88rem; font-weight: 600; margin-bottom: 8px; color: var(--text-muted);">Technical Specifications</h4>
          <table class="spec-table">
            <tbody>
              ${specsRows}
            </tbody>
          </table>
        </div>

        <button class="btn btn-primary" style="margin-top: 8px; justify-content: center; width: 100%; padding: 12px;" onclick="closeDetail()">
          ← Back to Visual Matches
        </button>
      `;

      detailOverlay.style.display = 'flex';
    }

    function closeDetail() {
      detailOverlay.style.display = 'none';
      document.querySelectorAll('.lens-card').forEach(c => c.classList.remove('active'));
    }
  </script>
</body>
</html>
